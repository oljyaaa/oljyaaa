name: Generate Snake

on:
  # Run automatically every 24 hours
  schedule:
    - cron: "0 0 * * *"
  # Allows manual execution from the Actions tab
  workflow_dispatch:
  # Run on every push to the main branch
  push:
    branches:
      - main

jobs:
  generate:
    permissions: 
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Generates the snake SVG
      - name: Generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-light&color_snake=#6FA53A&color_dots=#EBEDF0,#FAD6DF,#F4A7B9,#D9768F,#A8445E
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#B9E769&color_dots=#161B22,#3B2A33,#7A3F55,#C76A86,#F4A7B9

      # Push the generated files to the "output" branch
      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
